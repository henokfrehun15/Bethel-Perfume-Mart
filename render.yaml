# Render Blueprint for the Bethel Perfume API (free plan).
#
# Deploy: Render dashboard → New → Blueprint → select this repository.
# Values marked `sync: false` are prompted for during setup (or set
# later under Environment). The blueprint is wired for the free-tier
# stack documented in README.md: Neon (DATABASE_URL), Cloudflare R2 or
# Backblaze B2 (S3_*), and the storefront deployed on Vercel
# (CLIENT_URL).
services:
  - type: web
    name: bethel-perfume-api
    runtime: node
    plan: free
    rootDir: server
    # devDependencies (typescript, tsx) are needed by the build and the
    # migration step even though Render sets NODE_ENV=production.
    buildCommand: npm install --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Pooled connection string from Neon (DATABASE_SSL defaults to 1).
      - key: DATABASE_URL
        sync: false
      # Random secret generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Storefront URL on Vercel, e.g. https://bethel-perfume.vercel.app
      - key: CLIENT_URL
        sync: false
      # Storefront and API live on different domains, so the admin
      # cookie must be SameSite=None (it is then always Secure).
      - key: COOKIE_SAME_SITE
        value: none
      # Render terminates TLS in front of the app; without this the
      # rate limiter would see the proxy IP for every request.
      - key: TRUST_PROXY
        value: "1"
      # Free-tier filesystems are wiped on every deploy and restart,
      # so production images must live in object storage.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      # "auto" for Cloudflare R2; Backblaze B2 uses the bucket's region.
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # https://<account>.r2.cloudflarestorage.com (R2) or
      # https://s3.<region>.backblazeb2.com (B2).
      - key: S3_ENDPOINT
        sync: false
      # Public bucket URL. R2's S3 endpoint does not serve objects
      # publicly, so this must be the r2.dev / custom-domain URL.
      - key: S3_PUBLIC_URL
        sync: false
