name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the newest commit per ref needs to report.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: API — typecheck + tests
    runs-on: ubuntu-latest

    # Integration tests need a real database. Unit tests mock the
    # pool, but the same command runs both once TEST_DATABASE_URL
    # is present (see server/src/tests/integration).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bethel
          POSTGRES_PASSWORD: bethel
          POSTGRES_DB: bethel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bethel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: postgresql://bethel:bethel@localhost:5432/bethel_test
      TEST_DATABASE_URL: postgresql://bethel:bethel@localhost:5432/bethel_test
      DATABASE_SSL: "false"
      JWT_SECRET: ci-secret-not-for-production
      JWT_EXPIRES_IN: 1h
      CLIENT_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (unit + integration)
        run: npm test

  client:
    name: Storefront — lint, typecheck, tests, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    env:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build