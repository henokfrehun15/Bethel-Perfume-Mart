# Render Blueprint for the Bethel Perfume API (free plan).
#
# Deploy: Render dashboard → New → Blueprint → select this repository.
# Values marked `sync: false` are prompted for during setup (or set
# later under Environment). The blueprint is wired for the free-tier
# stack documented in README.md: Neon (DATABASE_URL), Supabase Storage
# (SUPABASE_* — no payment method required), and the storefront
# deployed on Vercel (CLIENT_URL).
services:
  - type: web
    name: bethel-perfume-api
    runtime: node
    plan: free
    rootDir: server
    # devDependencies (typescript, tsx) are needed by the build and the
    # migration step even though Render sets NODE_ENV=production.
    buildCommand: npm install --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Pin the Node major used for the build and at runtime so
      # deploys match local development instead of Render's default.
      - key: NODE_VERSION
        value: "22"
      # Pooled connection string from Neon (DATABASE_SSL defaults to 1).
      - key: DATABASE_URL
        sync: false
      # Random secret generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Storefront URL on Vercel, e.g. https://bethel-perfume.vercel.app
      - key: CLIENT_URL
        sync: false
      # Storefront and API live on different domains, so the admin
      # cookie must be SameSite=None (it is then always Secure).
      - key: COOKIE_SAME_SITE
        value: none
      # Render terminates TLS in front of the app; without this the
      # rate limiter would see the proxy IP for every request.
      - key: TRUST_PROXY
        value: "1"
      # Free-tier filesystems are wiped on every deploy and restart,
      # so production images must live in object storage. Supabase
      # Storage's free tier needs no payment method (unlike R2 and
      # public B2 buckets); the API also supports STORAGE_DRIVER=s3
      # for S3-compatible providers — see README.md.
      - key: STORAGE_DRIVER
        value: supabase
      # https://<project-ref>.supabase.co
      - key: SUPABASE_URL
        sync: false
      # Bucket name, created as Public in Supabase Storage.
      - key: SUPABASE_BUCKET
        sync: false
      # Service role key (server-only; bypasses storage RLS).
      - key: SUPABASE_SERVICE_KEY
        sync: false
